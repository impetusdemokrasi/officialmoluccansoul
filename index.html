    // IndexedDB helper for large videos & images
    const DB_NAME = 'MoluccanSoulDB';
    const STORE_NAME = 'profileStore';

    const saveProfileToIDB = (data) => {
      return new Promise((resolve) => {
        try {
          const request = indexedDB.open(DB_NAME, 1);
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME);
            }
          };
          request.onsuccess = (e) => {
            const db = e.target.result;
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).put(data, 'moluccan_soul_profile');
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          };
          request.onerror = () => resolve(false);
        } catch {
          resolve(false);
        }
      });
    };

    const loadProfileFromIDB = () => {
      return new Promise((resolve) => {
        try {
          const request = indexedDB.open(DB_NAME, 1);
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME);
            }
          };
          request.onsuccess = (e) => {
            const db = e.target.result;
            const tx = db.transaction(STORE_NAME, 'readonly');
            const getReq = tx.objectStore(STORE_NAME).get('moluccan_soul_profile');
            getReq.onsuccess = () => resolve(getReq.result || null);
            getReq.onerror = () => resolve(null);
          };
          request.onerror = () => resolve(null);
        } catch {
          resolve(null);
        }
      });
    };

                              });
                            }}
                            className="px-2.5 py-1 bg-rose-600/30 hover:bg-rose-600/50 text-rose-300 border border-rose-500 rounded-lg font-bold text-[10px]"
                          >
                            Hapus
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="flex justify-end pt-3 border-t border-red-900/60">
                  <button type="button" onClick={() => setIsEditSponsorsModalOpen(false)} className="px-5 py-2.5 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 rounded-xl text-xs font-black shadow-lg">Tutup</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: EDIT COMMUNITY PROFILE */}
          {isEditProfileModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <form onSubmit={handleSaveProfileChanges} className="bg-red-950/95 border border-red-800 rounded-3xl w-full max-w-lg p-6 space-y-5 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-red-900/60 pb-3">
                  <h3 className="text-base font-bold text-white">Edit Informasi Utama & Public View Komunitas</h3>
                  <button type="button" onClick={() => setIsEditProfileModal(false)} className="text-slate-400 hover:text-white"><X className="w-5 h-5" /></button>
                </div>

                <div className="space-y-4 text-xs">
                  <div className="space-y-1">
                    <label className="text-slate-300 font-bold">Judul Web Komunitas</label>
                    <input
                      type="text"
                      value={tempProfile.title}
                      onChange={(e) => setTempProfile({ ...tempProfile, title: e.target.value })}
                      className="w-full bg-black/60 border border-red-900 rounded-xl p-3 text-white font-bold"
                    />
                  </div>

                  <div className="space-y-1.5 bg-black/40 p-3 rounded-2xl border border-red-900/60">
                    <label className="text-slate-300 font-bold block">Unggah Logo Komunitas (Header Navbar):</label>
                    <div className="flex items-center gap-3">
                      {tempProfile.communityLogo && <img src={tempProfile.communityLogo} alt="Logo Preview" className="w-10 h-10 rounded-xl object-cover border border-amber-500" />}
                      <input type="file" accept="image/*" onChange={handleCommunityLogoUpload} className="w-full text-slate-300 text-[10px] file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-[10px] file:font-semibold file:bg-amber-500 file:text-slate-950" />
                    </div>
                  </div>

                  <div className="space-y-2 bg-black/40 p-3 rounded-2xl border border-red-900/60">
                    <div className="flex justify-between items-center">
                      <label className="text-slate-300 font-bold">Opacity (Transparansi) Video Background Frame</label>
                      <span className="text-amber-400 font-bold font-mono">{Math.round((tempProfile.backgroundOpacity ?? 0.8) * 100)}%</span>
                    </div>
                    <input
                      type="range"
                      min="0.1"
                      max="1.0"
                      step="0.05"
                      value={tempProfile.backgroundOpacity ?? 0.8}
                      onChange={(e) => setTempProfile({ ...tempProfile, backgroundOpacity: parseFloat(e.target.value) })}
                      className="w-full accent-amber-500 cursor-pointer"
                    />
                  </div>

                  <div className="space-y-1.5 bg-black/40 p-3 rounded-2xl border border-red-900/60">
                    <label className="text-slate-300 font-bold block">Unggah File Video Background (.mp4):</label>
                    <input type="file" accept="video/mp4,video/*" onChange={handleBackgroundVideoUpload} className="w-full text-slate-300 text-[10px] file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-[10px] file:font-semibold file:bg-amber-500 file:text-slate-950" />
                  </div>

                  <div className="space-y-1">
                    <label className="text-slate-300 font-bold">Tagline / Slogan</label>
                    <input type="text" value={tempProfile.tagline} onChange={(e) => setTempProfile({ ...tempProfile, tagline: e.target.value })} className="w-full bg-black/60 border border-red-900 rounded-xl p-3 text-white" />
                  </div>

                  <div className="space-y-1">
                    <label className="text-slate-300 font-bold">Deskripsi Komunitas</label>
                    <textarea rows={3} value={tempProfile.description} onChange={(e) => setTempProfile({ ...tempProfile, description: e.target.value })} className="w-full bg-black/60 border border-red-900 rounded-xl p-3 text-white" />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div className="space-y-1">
                      <label className="text-slate-300 font-bold">Nomor WhatsApp Booking</label>
                      <input type="text" value={tempProfile.contactWhatsapp} onChange={(e) => setTempProfile({ ...tempProfile, contactWhatsapp: e.target.value })} className="w-full bg-black/60 border border-red-900 rounded-xl p-3 text-white" />
                    </div>
                    <div className="space-y-1">
                      <label className="text-slate-300 font-bold">Email Kerja Sama</label>
                      <input type="text" value={tempProfile.contactEmail} onChange={(e) => setTempProfile({ ...tempProfile, contactEmail: e.target.value })} className="w-full bg-black/60 border border-red-900 rounded-xl p-3 text-white" />
                    </div>
                  </div>
                </div>

                <div className="flex justify-end gap-3 pt-4 border-t border-red-900/60">
                  <button type="button" onClick={() => setIsEditProfileModal(false)} className="px-4 py-2 bg-red-950 text-slate-300 border border-red-800 rounded-xl text-xs font-bold">Batal</button>
                  <button type="submit" className="px-5 py-2 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 rounded-xl text-xs font-black shadow-lg">Simpan Perubahan</button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL: EDIT / ADD MEMBER */}
          {isEditMemberProfileModal && tempMemberEdit && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  setDancers(prev => {
                    const exists = prev.some(d => d.id === tempMemberEdit.id);
                    return exists ? prev.map(d => d.id === tempMemberEdit.id ? tempMemberEdit : d) : [...prev, tempMemberEdit];
                  });
                  setIsEditMemberProfileModal(false);
                }}
                className="bg-red-950/95 border border-red-800 rounded-3xl w-full max-w-lg p-6 space-y-5 shadow-2xl max-h-[90vh] overflow-y-auto"
              >
                <div className="flex justify-between items-center border-b border-red-900/60 pb-3">
                  <h3 className="text-base font-bold text-white">{dancers.some(d => d.id === tempMemberEdit.id) ? 'Edit Profil Dancer' : 'Input Anggota Baru'}</h3>
                  <button type="button" onClick={() => setIsEditMemberProfileModal(false)} className="text-slate-400 hover:text-white"><X className="w-5 h-5" /></button>
                </div>

                <div className="space-y-4 text-xs">
                  <div className="flex items-center space-x-4 bg-black/40 p-3 rounded-2xl border border-red-900/60">
                    <img src={tempMemberEdit.profilePicture} alt="Preview" className="w-14 h-14 rounded-xl object-cover border border-amber-500" />
                    <div className="space-y-1.5 flex-1">
                      <label className="text-slate-300 font-bold block">Foto Profil (Upload File):</label>
                      <input type="file" accept="image/*" onChange={handleMemberProfilePicUpload} className="w-full text-slate-300 text-[10px] file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-[10px] file:font-semibold file:bg-amber-500 file:text-slate-950" />
                    </div>
                  </div>

                  <div className="space-y-1.5">
                    <label className="text-slate-300 font-bold block">1. Nama:</label>
                    <input type="text" required value={tempMemberEdit.name} onChange={(e) => setTempMemberEdit({ ...tempMemberEdit, name: e.target.value })} className="w-full bg-black/60 border border-red-900 rounded-xl p-3 text-white" />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div className="space-y-1.5">
                      <label className="text-slate-300 font-bold block">Username Portal:</label>
                      <input type="text" required value={tempMemberEdit.username} onChange={(e) => setTempMemberEdit({ ...tempMemberEdit, username: e.target.value })} className="w-full bg-black/60 border border-red-900 rounded-xl p-3 text-amber-300 font-bold" />
                    </div>
                    <div className="space-y-1.5">
                      <label className="text-slate-300 font-bold block">Password Portal:</label>
                      <input type="text" required value={tempMemberEdit.password} onChange={(e) => setTempMemberEdit({ ...tempMemberEdit, password: e.target.value })} className="w-full bg-black/60 border border-red-900 rounded-xl p-3 text-amber-300 font-bold" />
                    </div>
                  </div>

                  <div className="space-y-1.5">
                    <label className="text-slate-300 font-bold block">2. NIK:</label>
                    <input type="text" value={tempMemberEdit.nik} onChange={(e) => setTempMemberEdit({ ...tempMemberEdit, nik: e.target.value })} className="w-full bg-black/60 border border-red-900 rounded-xl p-3 text-white font-mono" />
                  </div>

                  <div className="space-y-1.5">
                    <label className="text-slate-300 font-bold block">3. Alamat:</label>
                    <textarea rows={2} value={tempMemberEdit.address} onChange={(e) => setTempMemberEdit({ ...tempMemberEdit, address: e.target.value })} className="w-full bg-black/60 border border-red-900 rounded-xl p-3 text-white" />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div className="space-y-1.5">
                      <label className="text-slate-300 font-bold block">4. Nama Bank:</label>
                      <input type="text" value={tempMemberEdit.bankName} onChange={(e) => setTempMemberEdit({ ...tempMemberEdit, bankName: e.target.value })} className="w-full bg-black/60 border border-red-900 rounded-xl p-3 text-white" />
                    </div>
                    <div className="space-y-1.5">
                      <label className="text-slate-300 font-bold block">5. No Rekening:</label>
                      <input type="text" value={tempMemberEdit.bankAccount} onChange={(e) => setTempMemberEdit({ ...tempMemberEdit, bankAccount: e.target.value })} className="w-full bg-black/60 border border-red-900 rounded-xl p-3 text-white font-mono" />
                    </div>
                  </div>

                  <div className="space-y-1.5">
                    <label className="text-slate-300 font-bold block">6. No WhatsApp:</label>
                    <input type="text" value={tempMemberEdit.phone} onChange={(e) => setTempMemberEdit({ ...tempMemberEdit, phone: e.target.value })} className="w-full bg-black/60 border border-red-900 rounded-xl p-3 text-white" />
                  </div>
                </div>

                <div className="flex justify-end gap-3 pt-4 border-t border-red-900/60">
                  <button type="button" onClick={() => setIsEditMemberProfileModal(false)} className="px-4 py-2 bg-red-950 text-slate-300 border border-red-800 rounded-xl text-xs font-bold">Batal</button>
                  <button type="submit" className="px-5 py-2 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 rounded-xl text-xs font-black shadow-lg">Simpan Profil</button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL: CREATE / EDIT EVENT */}
          {isNewEventModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <form onSubmit={handleCreateEvent} className="bg-red-950/95 border border-red-800 rounded-3xl w-full max-w-2xl p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-red-900/60 pb-3">
                  <h3 className="text-base font-bold text-white">{editingEventId ? 'Edit Event Ini' : 'Input Event Baru'}</h3>
                  <button type="button" onClick={() => setIsNewEventModalOpen(false)} className="text-slate-400 hover:text-white"><X className="w-5 h-5" /></button>
                </div>

                <div className="space-y-3 text-xs">
                  <div className="space-y-1">
                    <label className="text-slate-300 font-bold">1. Nama Event</label>
                    <input type="text" required value={newEvent.title} onChange={(e) => setNewEvent({ ...newEvent, title: e.target.value })} className="w-full bg-black/60 border border-red-900 rounded-xl p-3 text-white" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div className="space-y-1">
                      <label className="text-slate-300 font-bold">2. Kategori Event</label>
                      <input type="text" required value={newEvent.type} onFocus={(e) => e.target.value === '...' && setNewEvent({ ...newEvent, type: '' })} onChange={(e) => setNewEvent({ ...newEvent, type: e.target.value })} className="w-full bg-black/60 border border-red-900 rounded-xl p-3 text-white" />
                    </div>
                    <div className="space-y-1">
                      <label className="text-slate-300 font-bold">3. Tanggal Pelaksanaan</label>
                      <input type="date" required value={newEvent.date} onChange={(e) => setNewEvent({ ...newEvent, date: e.target.value })} className="w-full bg-black/60 border border-red-900 rounded-xl p-3 text-white" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div className="space-y-1">
                      <label className="text-slate-300 font-bold">4. Waktu / Jam Acara</label>
                      <input type="text" required value={newEvent.time} onChange={(e) => setNewEvent({ ...newEvent, time: e.target.value })} className="w-full bg-black/60 border border-red-900 rounded-xl p-3 text-white" />
                    </div>
                    <div className="space-y-1">
                      <label className="text-slate-300 font-bold">5. Lokasi Acara</label>
                      <input type="text" required value={newEvent.location} onChange={(e) => setNewEvent({ ...newEvent, location: e.target.value })} className="w-full bg-black/60 border border-red-900 rounded-xl p-3 text-white" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div className="space-y-1">
                      <label className="text-slate-300 font-bold">6. Nama Client / Penyelenggara</label>
                      <input type="text" required value={newEvent.client} onChange={(e) => setNewEvent({ ...newEvent, client: e.target.value })} className="w-full bg-black/60 border border-red-900 rounded-xl p-3 text-white" />
                    </div>
                    <div className="space-y-1">
                      <label className="text-slate-300 font-bold">7. Total Pendapatan Event (Rp)</label>
                      <input type="number" required value={newEvent.totalRevenue} onFocus={(e) => e.target.value === '0' && setNewEvent({ ...newEvent, totalRevenue: '' })} onChange={(e) => setNewEvent({ ...newEvent, totalRevenue: e.target.value === '' ? '' : Number(e.target.value) })} className="w-full bg-black/60 border border-red-900 rounded-xl p-3 font-bold text-amber-400" />
                    </div>
                  </div>
                  <div className="space-y-1">
                    <label className="text-slate-300 font-bold">8. Jumlah Dancer Dibutuhkan</label>
                    <select value={newEvent.requiredDancers} onChange={(e) => setNewEvent({ ...newEvent, requiredDancers: e.target.value })} className="w-full bg-black/60 border border-red-900 rounded-xl p-3 text-white">
                      {Array.from({ length: 30 }, (_, i) => i + 1).map(num => (
                        <option key={num} value={String(num)}>{num} Dancer</option>
                      ))}
                    </select>
                  </div>

                  <div className="space-y-2 pt-2 border-t border-red-900/60">
                    <div className="flex justify-between items-center">
                      <label className="text-slate-200 font-black">9. Pemilihan Dancer</label>
                      <button
                        type="button"
                        onClick={() => {
                          if (!newEvent.date) {
                            showNotification('Silakan isi Tanggal pelaksanaan terlebih dahulu sebelum memilih dancer!');
                            return;
                          }
                          setIsDancerSelectionModalOpen(true);
                        }}
                        className="px-4 py-2 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 rounded-xl font-black text-xs shadow-md"
                      >
                        Pilih Dancer ({newEvent.assignedDancerIds?.length || 0} Terpilih)
                      </button>
                    </div>
                    <div className="flex flex-wrap gap-1.5 bg-black/40 p-3 rounded-xl border border-red-900/50">
                      {newEvent.assignedDancerIds?.length > 0 ? (
                        dancers.filter(d => newEvent.assignedDancerIds.includes(d.id)).map(d => (
                          <span key={d.id} className="px-2.5 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-lg text-[10px] font-bold">
                            ✓ {d.name}
                          </span>
                        ))
                      ) : (
                        <span className="text-[10px] text-slate-400 italic">Belum ada dancer yang dipilih.</span>
                      )}
                    </div>
                  </div>

                  <div className="space-y-1">
                    <label className="text-slate-300 font-bold">10. Deskripsi Event</label>
                    <textarea rows={2} value={newEvent.description} onChange={(e) => setNewEvent({ ...newEvent, description: e.target.value })} className="w-full bg-black/60 border border-red-900 rounded-xl p-3 text-white" />
                  </div>
                </div>

                <div className="flex justify-between items-center pt-4 border-t border-red-900/60">
                  <button type="button" onClick={() => setIsNewEventModalOpen(false)} className="px-4 py-2 bg-red-950 text-slate-300 border border-red-800 rounded-xl text-xs font-bold">Batal</button>
                  <button type="submit" className="px-5 py-2.5 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 rounded-xl text-xs font-black shadow-lg">
                    {editingEventId ? 'Simpan Perubahan Event' : 'Simpan Event'}
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL: DANCER SELECTION SYSTEM */}
          {isDancerSelectionModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-red-950/95 border border-red-800 rounded-3xl w-full max-w-3xl p-6 space-y-6 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-red-900/60 pb-3">
                  <div>
                    <h3 className="text-base font-black text-white">Sistem Pemilihan Dancer</h3>
                    <p className="text-xs text-amber-400">Tanggal Event: <strong>{newEvent.date}</strong> | Dibutuhkan: <strong>{newEvent.requiredDancers} Dancer</strong></p>
                  </div>
                  <button type="button" onClick={() => setIsDancerSelectionModalOpen(false)} className="text-slate-400 hover:text-white"><X className="w-5 h-5" /></button>
                </div>

                <div className="space-y-2.5 max-h-[55vh] overflow-y-auto pr-1">
                  {dancers.map(dancer => {
                    const log = dancer.dailyAttendanceLogs?.[newEvent.date];
                    const status = log ? log.status : 'Bisa';
                    const isLocked = status === 'Ijin' || status === 'Sakit';
                    const isSelected = newEvent.assignedDancerIds?.includes(dancer.id);

                    return (
                      <div key={dancer.id} className="bg-black/50 p-3.5 rounded-2xl border border-red-900/60 flex items-center justify-between gap-3 text-xs">
                        <div className="flex items-center space-x-3">
                          <img src={dancer.profilePicture} alt={dancer.name} className="w-10 h-10 rounded-xl object-cover border border-amber-500" />
                          <div>
                            <p className="font-bold text-white">{dancer.name} <span className="text-[10px] text-amber-400">({dancer.type})</span></p>
                            <span className={`inline-block px-2 py-0.5 rounded text-[9px] font-bold border mt-0.5 ${
                              isLocked ? 'bg-rose-500/10 text-rose-400 border-rose-500/30' : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30'
                            }`}>
                              {isLocked ? `Tidak Tersedia (${status})` : 'Tersedia (Bisa)'}
                            </span>
                          </div>
                        </div>

                        <button
                          type="button"
                          disabled={isLocked && !isSelected}
                          onClick={() => {
                            setNewEvent(prev => {
                              const current = prev.assignedDancerIds || [];
                              return current.includes(dancer.id)
                                ? { ...prev, assignedDancerIds: current.filter(id => id !== dancer.id) }
                                : { ...prev, assignedDancerIds: [...current, dancer.id] };
                            });
                          }}
                          className={`px-3.5 py-1.5 rounded-lg text-[10px] font-black transition-all ${
                            isLocked && !isSelected ? 'bg-slate-800 text-slate-500 cursor-not-allowed' :
                            isSelected ? 'bg-emerald-600 text-slate-950 shadow' : 'bg-amber-500 text-slate-950 hover:bg-amber-400'
                          }`}
                        >
                          {isSelected ? '✓ Terpilih' : isLocked ? 'Terkunci' : 'Pilih'}
                        </button>
                      </div>
                    );
                  })}
                </div>

                <div className="flex justify-between items-center pt-4 border-t border-red-900/60">
                  <button type="button" onClick={() => setNewEvent(prev => ({ ...prev, assignedDancerIds: [] }))} className="px-4 py-2 bg-red-950 text-rose-400 border border-red-800 rounded-xl text-xs font-bold">
                    Hapus Pilihan
                  </button>
                  <button type="button" onClick={() => setIsDancerSelectionModalOpen(false)} className="px-6 py-2.5 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 rounded-xl font-black text-xs shadow-lg">
                    Simpan & Tutup ({newEvent.assignedDancerIds?.length || 0} Terpilih)
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
